# Perfil de producción: la única PC del local, con Postgres local, sin salida a internet.
#
# Nada acá tiene un valor por defecto para lo sensible. Antes "prod" era el application.yml
# base sin sufijo: si -Dspring.profiles.active=prod se tipeaba mal o este archivo no
# existía, Spring lo ignoraba en silencio y caía en ese base, que SÍ tenía credenciales y
# clave JWT hardcodeadas — arrancaba igual, con lo de desarrollo, sin avisar. Ahora, si falta
# un valor requerido, el arranque falla con una excepción que lo nombra.
#
# DE DÓNDE SALEN ESOS VALORES. De dos lugares, y en este orden: primero las variables de
# entorno, después el archivo de configuración de la máquina. El archivo es lo que va a
# escribir el instalador; las variables son la forma de pisarlo sin tocarlo, que es como se
# trabaja en desarrollo.

spring:
  config:
    # EL ARCHIVO DE CONFIGURACIÓN DE ESTA MÁQUINA.
    #
    # Lo escribe el instalador con credenciales generadas al azar, y por eso el backend tiene
    # que poder leerlo: las variables de entorno son una convención de servidores, no de
    # software de escritorio — nadie va a abrir las propiedades del sistema en el mostrador.
    #
    # POR QUÉ ProgramData Y NO Program Files. Program Files es para el programa, y Windows lo
    # quiere de solo lectura después de instalar; ProgramData es la carpeta que Microsoft
    # define para datos de aplicación por máquina, que es exactamente lo que esto es. Además
    # deja escribirlo de nuevo sin permisos de administrador el día que haya que rotar la
    # clave. Ver docs/CONFIG_FILE.md.
    #
    # "optional:" NO ES UN DESCUIDO: sin eso, el arranque fallaría cuando el archivo no
    # existe, y no existe en ninguna de las dos situaciones en las que hoy se corre con perfil
    # prod sin instalador — la máquina de desarrollo con las variables puestas a mano, y el
    # modo producción sin empaquetar del shell de Electron. El que falta un valor se sigue
    # avisando igual, porque los placeholders de abajo no tienen default.
    #
    # SERPENT_CONFIG_FILE existe para poder apuntarlo a otro lado en una prueba, sin tocar
    # este archivo ni instalar nada.
    import: optional:file:${SERPENT_CONFIG_FILE:C:/ProgramData/sERPent/serpent.properties}

  datasource:
    # Host fijo a propósito: Postgres corre en esta misma PC, no hay otro entorno apuntando a
    # otro host.
    #
    # EL PUERTO NO PUEDE SER FIJO. El instalador crea una instancia propia y elige el puerto:
    # 5432 si está libre, el primero libre desde 5433 si no. Una PC que no es nueva puede
    # tener ya un PostgreSQL ocupando el 5432, y ésa es la situación más probable de todas.
    # El default de 5432 es el caso normal, no una suposición.
    #
    # DB_NAME y DB_PORT tienen default porque no son sensibles; usuario y contraseña NO lo
    # tienen — salen del entorno o del archivo de arriba, nunca de un archivo versionado.
    #
    # Los placeholders se llaman igual que las variables de entorno A PROPÓSITO: el archivo de
    # configuración usa esos mismos nombres como claves, así que los dos orígenes compiten por
    # el mismo nombre y la precedencia la resuelve Spring sola, sin una línea de código.
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:serpent_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manda el esquema, Hibernate solo valida contra él.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # db/migration es el esquema historico de Postgres, congelado. db/common es donde va todo
    # lo nuevo, escrito una sola vez para los dos motores: Flyway junta las dos carpetas y las
    # ordena por numero de version, asi que el piso de V40 de common la deja siempre despues.
    # Ver db/common/README.md.
    locations: classpath:db/migration,classpath:db/common
    baseline-on-migrate: true
    validate-on-migrate: true

serpent:
  jwt:
    # Sin default deliberadamente: la clave de desarrollo vive en application-dev.yml y NO
    # tiene que poder llegar nunca a un arranque real. Si JWT_SECRET no está seteada, Spring
    # no puede resolver el placeholder y el contexto falla al arrancar — eso es lo que se
    # pidió: que la app no levante en vez de levantar con la clave equivocada.
    secret: ${JWT_SECRET}
    expiration-ms: 28800000

  # Orígenes que el navegador puede usar para llamar a la API (ver CorsConfig).
  #
  # EL SHELL DE ELECTRON YA EXISTE, y la respuesta a la pregunta que quedaba abierta acá es
  # que no hay que sumar nada: su origen (serpent://app) NO va en esta lista, ni hace falta
  # que vaya. El shell no deja que el navegador cruce a http — intercepta /api en el proceso
  # principal de Electron y es él quien llama al backend—, así que para el navegador el
  # pedido sale y vuelve por su propio origen y no hay petición cruzada que permitir. Lo que
  # llega hasta acá es un cliente HTTP común, que no está sujeto a la política del navegador.
  #
  # El único origen que esta lista todavía necesita es el dev server de Angular, que sí es un
  # navegador parado en http://localhost:4200 llamando al 8080.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Log a archivo con rotación: sin esto, un fallo a las 9am que se descubre a las 6pm no deja
# nada para mirar — la consola de un proceso en background no se conserva.
# Ubicación: ${SERPENT_LOG_DIR:./logs}/serpent.log — por defecto una carpeta "logs" relativa
# al directorio desde el que se arranca el jar (documentado en el runbook de esta PC). Se
# puede fijar a una ruta absoluta con SERPENT_LOG_DIR si se prefiere no depender de cuál sea
# el directorio de trabajo del proceso.
logging:
  file:
    name: ${SERPENT_LOG_DIR:./logs}/serpent.log
  logback:
    rollingpolicy:
      # Lo que dispare primero: 20MB de un archivo, o el cambio de día.
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 500MB
