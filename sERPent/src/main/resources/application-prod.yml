# Perfil de producción: la única PC del local, con Postgres local, sin salida a internet.
#
# Nada acá tiene un valor por defecto para lo sensible. Antes "prod" era el application.yml
# base sin sufijo: si -Dspring.profiles.active=prod se tipeaba mal o este archivo no
# existía, Spring lo ignoraba en silencio y caía en ese base, que SÍ tenía credenciales y
# clave JWT hardcodeadas — arrancaba igual, con lo de desarrollo, sin avisar. Ahora, si falta
# una variable requerida, el arranque falla con una excepción que nombra la variable — ver
# el comentario de cada una abajo para cómo setearlas en esta PC.

spring:
  datasource:
    # Host y puerto fijos a propósito: Postgres corre en esta misma PC, no hay otro entorno
    # apuntando a otro host. DB_NAME tiene default porque el nombre de la base no es
    # sensible; usuario y contraseña NO lo tienen — deben vivir en variables de entorno de
    # esta PC, nunca en un archivo versionado.
    url: jdbc:postgresql://localhost:5432/${DB_NAME:serpent_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manda el esquema, Hibernate solo valida contra él.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

serpent:
  jwt:
    # Sin default deliberadamente: la clave de desarrollo vive en application-dev.yml y NO
    # tiene que poder llegar nunca a un arranque real. Si JWT_SECRET no está seteada, Spring
    # no puede resolver el placeholder y el contexto falla al arrancar — eso es lo que se
    # pidió: que la app no levante en vez de levantar con la clave equivocada.
    secret: ${JWT_SECRET}
    expiration-ms: 28800000

  # Orígenes que el navegador puede usar para llamar a la API (ver CorsConfig). El shell de
  # Electron (sERPent-desktop) todavía no existe en este repo — es un módulo documentado en
  # ARCHITECTURE.md pero sin código — así que no puedo saber si su origen real va a ser
  # http://localhost:PUERTO, un esquema custom, o file://, y file:// ni siquiera entra en
  # esta lista (los navegadores mandan Origin: null para file://, que esta config no permite
  # a propósito). Cuando exista, sumar su origen acá vía CORS_ALLOWED_ORIGINS. Por ahora
  # el único valor conocido y en uso es el dev server de Angular.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Log a archivo con rotación: sin esto, un fallo a las 9am que se descubre a las 6pm no deja
# nada para mirar — la consola de un proceso en background no se conserva.
# Ubicación: ${SERPENT_LOG_DIR:./logs}/serpent.log — por defecto una carpeta "logs" relativa
# al directorio desde el que se arranca el jar (documentado en el runbook de esta PC). Se
# puede fijar a una ruta absoluta con SERPENT_LOG_DIR si se prefiere no depender de cuál sea
# el directorio de trabajo del proceso.
logging:
  file:
    name: ${SERPENT_LOG_DIR:./logs}/serpent.log
  logback:
    rollingpolicy:
      # Lo que dispare primero: 20MB de un archivo, o el cambio de día.
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 500MB
