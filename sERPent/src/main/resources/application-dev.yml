spring:
  datasource:
    url: jdbc:h2:mem:serpentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration-h2
    baseline-on-migrate: true
    validate-on-migrate: true

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console