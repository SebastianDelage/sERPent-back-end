spring:
  datasource:
    url: jdbc:h2:mem:serpentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    # Dos carpetas: el esquema y los datos de referencia en la primera, el negocio de mentira
    # en la segunda. El perfil de test carga solo la primera, y ésa es toda la diferencia
    # entre lo que ve un test y lo que ve quien levanta el proyecto para mirar pantallas.
    # Flyway ordena por versión mezclando las dos, así que el demo (2.1) sigue entrando
    # justo después de la referencia (2) y antes de V3, como corría antes de separarse.
    locations: classpath:db/migration-h2,classpath:db/seed-dev,classpath:db/common
    baseline-on-migrate: true
    validate-on-migrate: true

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

serpent:
  jwt:
    # Fallback SOLO acá: dev no maneja datos reales, así que una clave fija y visible en el
    # repo es aceptable. El perfil prod exige JWT_SECRET sin default (ver application-prod.yml)
    # justamente para que este mismo valor no pueda colarse en un arranque real por descuido.
    secret: ${JWT_SECRET:claveDeDesarrolloLargaYAleatoriaDeAlMenos32Caracteres1234567890}
    expiration-ms: 28800000