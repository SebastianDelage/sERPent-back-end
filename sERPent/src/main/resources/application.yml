# Config común a todos los perfiles. Deliberadamente sin datasource, JWT ni logging: cada
# perfil (dev, prod) es dueño completo de esas tres cosas, para que activar un perfil no
# dependa de que el archivo base "por casualidad" ya tenga lo correcto. Antes de esto, un
# typo en -Dspring.profiles.active=prod (sin application-prod.yml) caía en silencio acá y
# arrancaba contra Postgres con credenciales de este archivo — funcionaba por accidente.
server:
  port: 8080

