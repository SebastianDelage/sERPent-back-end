# Perfil de verificacion contra el PostgreSQL de verdad de esta maquina.
#
# Lo usa SOLO NullableFilterQueriesPostgresTest, que corre a pedido con -Dpgcheck=true. El
# suite normal no lo toca: ahi manda application-test.properties, que fija H2.
#
# POR QUE ESTE ARCHIVO NO PUEDE ROMPER LA BASE. El antecedente esta escrito en
# application-test.properties: un @SpringBootTest sin perfil se conecto una vez al PostgreSQL
# del desarrollador y hubo que reconstruir el esquema. Este perfil SI apunta a esa base a
# proposito —es el punto—, asi que la garantia no puede ser "apunta a otro lado":
#
#   flyway.enabled=false   no migra, no crea, no versiona.
#   ddl-auto=validate      Hibernate compara y no toca. Nunca crea ni borra.
#   y los tests son SELECT, sin un solo save, delete ni flush.
#
# Las credenciales NO tienen default, igual que en prod: si faltan, el arranque falla y lo
# dice, en vez de intentar una base equivocada. Se aceptan las mismas variables que usa prod
# (DB_USERNAME / DB_PASSWORD) para no tener que definir un juego aparte.
spring.datasource.url=jdbc:postgresql://localhost:5432/${PGCHECK_DB_NAME:${DB_NAME:serpent_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGCHECK_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${PGCHECK_DB_PASSWORD:${DB_PASSWORD}}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JwtService lo exige sin default propio. No es sensible: por este perfil no pasa ninguna
# sesion, solo consultas de lectura.
serpent.jwt.secret=claveDeTestLargaYAleatoriaDeAlMenos32CaracteresParaFirmarTokens
serpent.jwt.expiration-ms=28800000
