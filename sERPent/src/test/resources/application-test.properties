# El perfil "test" no tiene que poder llegar nunca a una base real.
#
# La URL de H2 fijada abajo es lo que lo garantiza, y es lo unico que lo garantiza. Si este
# archivo no la declarara, un @SpringBootTest bajo este perfil heredaria el datasource de
# application.yml y se conectaria al PostgreSQL del desarrollador. Eso no es hipotetico: paso,
# y hubo que reconstruir el esquema desde las migraciones. Fijar H2 en memoria hace imposible
# el accidente, en vez de depender de que cada test futuro se acuerde de poner
# @AutoConfigureTestDatabase.
#
# Antes esa garantia se le atribuia a ddl-auto=create-drop, que ya no esta. La atribucion era
# equivocada incluso entonces: create-drop no impedia conectarse a la base equivocada, era el
# mecanismo por el cual conectarse a la base equivocada la destruia.
spring.datasource.url=jdbc:h2:mem:serpent_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# La suite corre las migraciones de verdad y despues valida las entidades contra el esquema
# que produjeron. Antes generaba el esquema desde las entidades con ddl-auto=create-drop, y
# eso significaba que ningun test veia el esquema real: alcanzaba con que una entidad y una
# migracion no coincidieran para tener la suite en verde contra algo que en produccion no
# existe. Ya oculto un bug concreto —la FK fk_inventory_stock_snapshot_last_movement, que
# Hibernate no crea porque la entidad mapea last_movement_id como Long plano en vez de
# @ManyToOne, y contra la que tres tests venian escribiendo ids inventados—.
#
# locations sin db/seed-dev a proposito: esa carpeta trae el negocio de demostracion, que a
# un test le sobra. Ver db/seed-dev/V2_1__seed_demo_data.sql.
#
# Costo medido al cambiar, con las dos configuraciones intercaladas para que la deriva de la
# maquina no se cuele en la comparacion: entre 1 y 4,5 segundos sobre una suite de unos 50.
# La diferencia no es estable ni vale la pena afinarla mas; lo que importa es que correr las
# migraciones de verdad no cuesta un orden de magnitud, que es lo que habria hecho dudar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2,classpath:db/common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JwtService requiere este valor sin default propio (@Value("${serpent.jwt.secret}")). Vivia
# heredado del fallback de application.yml base; al mover ese fallback a application-dev.yml
# (para que prod pueda exigir JWT_SECRET sin default) el perfil test se queda sin nada si no
# lo declara el suyo. No es sensible: ningun dato real pasa por este perfil.
serpent.jwt.secret=claveDeTestLargaYAleatoriaDeAlMenos32CaracteresParaFirmarTokens
serpent.jwt.expiration-ms=28800000
