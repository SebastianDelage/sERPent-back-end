# The "test" profile must never be able to reach a real database.
#
# ddl-auto=create-drop below is what makes that non-negotiable: inherit the main
# application.yml datasource and a @SpringBootTest running under this profile will happily
# connect to the developer's PostgreSQL and DROP THE WHOLE SCHEMA when its context shuts
# down. That is not hypothetical — it happened, and the schema had to be rebuilt from the
# migrations. Pinning an in-memory H2 here makes the accident impossible rather than
# relying on every future test remembering @AutoConfigureTestDatabase.
spring.datasource.url=jdbc:h2:mem:serpent_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
